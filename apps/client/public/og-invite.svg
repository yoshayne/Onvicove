<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="60%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#6366f1" opacity="0.06"/>
  <circle cx="150" cy="500" r="160" fill="#8b5cf6" opacity="0.05"/>

  <!-- Accent bar -->
  <rect x="80" y="270" width="6" height="90" rx="3" fill="url(#accent)"/>

  <!-- Brand -->
  <text x="80" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#64748b" text-transform="uppercase">SHOP SUITE DIRECT</text>

  <!-- Headline -->
  <text x="96" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="800" fill="#ffffff">Your site is ready.</text>

  <!-- Sub -->
  <text x="96" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#94a3b8">Claim your store and start selling today.</text>

  <!-- CTA pill -->
  <rect x="96" y="420" width="280" height="56" rx="10" fill="url(#accent)"/>
  <text x="236" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Set Up My Account →</text>

  <!-- Feature dots -->
  <circle cx="96" cy="540" r="5" fill="#6366f1"/>
  <text x="112" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#64748b">Products &amp; inventory</text>
  <circle cx="310" cy="540" r="5" fill="#8b5cf6"/>
  <text x="326" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#64748b">Bookings &amp; scheduling</text>
  <circle cx="540" cy="540" r="5" fill="#a78bfa"/>
  <text x="556" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#64748b">Orders &amp; customers</text>
</svg>
